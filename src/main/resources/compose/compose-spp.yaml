name: spp
networks:
  netkafka:
    driver: bridge

services:
  kafka01:
    image: bitnami/kafka:3.6.2
    container_name: kafka01
    networks:
      - netkafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://172.26.122.77:9092
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
    user: root
    volumes:
      - /tmp/kafka-data:/bitnami/kafka/data
    restart: always

  spp-xxljob:
    image: spp/xxl-job-admin:20260121v1
    container_name: spp-xxljob
    networks:
      - netkafka
    ports:
      - "8081:8081"
    restart: always

  spp-kafka:
    image: spp/kafka:20260121v1
    container_name: spp-kafka
    networks:
      - netkafka
    ports:
      - "18086:18086"
    restart: always
    depends_on:
      - kafka01

  spp-admin:
    image: spp/spp-admin:20260121v1
    container_name: spp-admin
    networks:
      - netkafka
    ports:
      - "10003:10003"
    restart: always
    depends_on:
      - spp-xxljob

  spp-actuator:
    image: spp/actuator:20260121v1
    container_name: spp-actuator
    networks:
      - netkafka
    ports:
      - "18093:18093"
    restart: always
    volumes:
      - ./actuator-logs:/spp/logs

  spp-ap-worker:
    image: spp/ap-worker:20260121v1
    container_name: spp-ap-worker
    networks:
      - netkafka
    ports:
      - "10006:10006"
    restart: always
